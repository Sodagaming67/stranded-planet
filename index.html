<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stranded Planet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05060f; }
    canvas { display: block; }
    #hint {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; z-index: 2; pointer-events: none; color: #fff; font-family: system-ui, sans-serif; text-align: center;
      background:
        radial-gradient(1px 1px at 12% 20%, #fff, transparent), radial-gradient(1px 1px at 80% 15%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 30% 75%, #fff, transparent), radial-gradient(1px 1px at 65% 85%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 90% 60%, #fff, transparent), radial-gradient(1px 1px at 8% 65%, #fff, transparent),
        radial-gradient(1px 1px at 50% 10%, #fff, transparent), radial-gradient(1.5px 1.5px at 22% 45%, #fff, transparent),
        radial-gradient(ellipse at center, #1d2357 0%, #05060f 75%);
    }
    #hint .planet {
      width: 120px; height: 120px; border-radius: 50%; margin-bottom: 8px; position: relative;
      background: radial-gradient(circle at 35% 30%, #a6e08c, #2f8f87 60%, #1b4f4a);
      box-shadow: 0 0 40px rgba(94, 242, 255, 0.35);
    }
    #hint .planet::after {
      content: ''; position: absolute; left: 22px; top: 18px; width: 18px; height: 10px; background: #d9dde6;
      border-radius: 2px; transform: rotate(-25deg); box-shadow: 6px -10px 0 -2px rgba(120, 125, 140, 0.8);
    }
    #hint h1 { font-size: 48px; letter-spacing: 2px; text-shadow: 0 4px 0 #ff7b29; }
    #hint .play { font-size: 22px; padding: 10px 26px; border: 2px solid #fff; border-radius: 10px; background: rgba(255, 255, 255, 0.12); }
    #hint .keys { font-size: 15px; opacity: 0.85; line-height: 1.8; }
    #hud { position: fixed; z-index: 1; top: 16px; left: 16px; font-family: system-ui, sans-serif; color: #fff; pointer-events: none; }
    .bar { display: flex; align-items: center; gap: 8px; font-weight: 700; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5); }
    .bar .track { width: 220px; height: 20px; background: rgba(0, 0, 0, 0.45); border: 2px solid #fff; border-radius: 6px; overflow: hidden; }
    .bar .fill { height: 100%; background: linear-gradient(#ff6b6b, #d62839); transition: width 0.2s; }
    .bar .icon { font-size: 22px; }
    #money {
      position: fixed; z-index: 1; top: 16px; right: 16px; display: flex; gap: 14px; padding: 8px 14px;
      background: rgba(20, 14, 8, 0.6); border: 2px solid rgba(232, 194, 90, 0.8); border-radius: 12px;
      font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 22px; color: #fff;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); pointer-events: none;
    }
    #money .row { display: flex; align-items: center; gap: 7px; }
    #money .coin { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25), 0 2px 0 rgba(0, 0, 0, 0.4); }
    #money .gold { background: radial-gradient(circle at 35% 30%, #fff3b0, #e8c25a 45%, #a87b12); }
    #money .silver { background: radial-gradient(circle at 35% 30%, #ffffff, #c9ced6 45%, #7d838d); }
    #notice {
      position: fixed; z-index: 1; left: 50%; bottom: 40px; transform: translateX(-50%); display: none;
      padding: 10px 18px; background: rgba(20, 14, 8, 0.75); border: 2px solid rgba(232, 194, 90, 0.8); border-radius: 10px;
      font-family: Georgia, 'Times New Roman', serif; font-size: 18px; color: #fff; text-align: center; pointer-events: none;
    }
    #clock {
      position: fixed; z-index: 1; top: 66px; right: 16px; padding: 4px 12px; background: rgba(20, 14, 8, 0.6);
      border-radius: 8px; font-family: Georgia, 'Times New Roman', serif; font-size: 16px; color: #f1e2bf; pointer-events: none;
    }
    #crosshair { position: fixed; z-index: 1; left: 50%; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; display: none; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); box-shadow: 0 0 2px #000; }
    #crosshair::before { left: 10px; top: 0; width: 2px; height: 22px; }
    #crosshair::after { top: 10px; left: 0; height: 2px; width: 22px; }
    #gun-info {
      position: fixed; z-index: 1; right: 16px; bottom: 16px; display: none; padding: 6px 12px; background: rgba(20, 14, 8, 0.65);
      border: 2px solid rgba(232, 194, 90, 0.7); border-radius: 8px; color: #f6ecd6; font-family: Georgia, serif; font-size: 15px; pointer-events: none;
    }
    #hint b { background: rgba(255, 255, 255, 0.18); padding: 1px 7px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="hud">
    <div class="bar">
      <span class="icon">❤️</span>
      <div class="track"><div class="fill" id="health-fill"></div></div>
      <span id="health-text">100</span>
    </div>
  </div>
  <div id="notice"></div>
  <div id="clock"></div>
  <div id="crosshair"></div>
  <div id="gun-info"></div>
  <div id="money" title="10 silver coins = 1 gold coin">
    <div class="row"><span class="coin gold"></span><span id="gold-count">0</span></div>
    <div class="row"><span class="coin silver"></span><span id="silver-count">0</span></div>
  </div>
  <div id="hint">
    <div class="planet"></div>
    <h1>STRANDED PLANET</h1>
    <div class="play" id="play-text">Click to play</div>
    <div class="keys">
      <b>W A S D</b> or <b>Arrows</b> move &nbsp; <b>Mouse</b> look &nbsp; <b>Space</b> jump &nbsp; <b>Shift</b> run<br />
      <b>E</b> talk / do a job task &nbsp; <b>B</b> bag &nbsp; <b>Click</b> fire a gun &nbsp; <b>Scroll</b> zoom &nbsp; <b>Esc</b> pause
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
